services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://orbit:${POSTGRES_PASSWORD}@db:5432/orbit
      ORBIT_API_TOKEN: ${ORBIT_API_TOKEN:?Set ORBIT_API_TOKEN in .env}
      ORBIT_DEFAULT_USER_ID: ${ORBIT_DEFAULT_USER_ID:-self-hosted}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8787}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8787:8787"
volumes:
  orbit_pgdata:
